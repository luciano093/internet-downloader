[package]
name = "internet-downloader-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bitvec = { version = "1.1.1", features = ["serde"] }
blake3 = { version = "1.8.6", features = ["mmap", "rayon"] }
bytecheck = "0.8.3"
bytes = "1.12.1"
chrono = "0.4.45"
dashmap = "6.2.1"
flume = "0.12.0"
fs4 = { version = "1.1.0", features = ["sync"] }
futures-util = "0.3.33"
http = "1.5.0"
indexmap = { version = "2.14.0", features = ["serde"] }
memmap2 = "0.9.11"
os_str_bytes = "7.2.1"
pin-project-lite = "0.2.17"
rand = "0.10.2"
regex = { version = "1.13.1", features = ["use_std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset", "system-proxy", "stream"] }
rquickjs = { version = "0.12.2", features = ["full-async", "parallel"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] } # replaces aws-lc-rs in reqwest which at the moment depends on having cmake installed in windows
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.21.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
strum = { version = "0.28.0", features = ["strum_macros"] }
strum_macros = "0.28.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "signal", "tokio-macros"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = { version = "2.5.7", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
debug = true
strip = false
